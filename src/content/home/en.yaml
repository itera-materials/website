problem:
  title: "A high-value material that too often goes to waste"
  body: "Carbon fibre composites make aircraft, vehicles, wind turbines and sports equipment lighter and stronger. Producing the fibre is energy-intensive, yet production scrap and end-of-life parts are still widely landfilled or incinerated."
  callout: "We believe that fibre should be recovered and used again."

approach:
  title: "Our approach: solvolysis"
  intro: "Rather than burning the resin away, solvolysis uses a chemical process to dissolve it, separating the carbon fibres so they can be cleaned and reused."
  steps:
    - title: "Collect"
      body: "Composite waste: production offcuts, prepreg scrap and end-of-life parts."
    - title: "Recover"
      body: "Solvolysis dissolves the resin matrix and frees the carbon fibres."
    - title: "Return"
      body: "Recycled carbon fibre goes back into new products and applications."

partners:
  title: "Who we work with"
  intro: "We work with partners on both sides of the composites value chain."
  groups:
    - title: "Companies with composite waste"
      body: "We take in carbon fibre waste from almost any industry: production offcuts, prepreg scrap and end-of-life parts, including from wind energy."
    - title: "Users of recycled fibre"
      body: "Every application has its own requirements, and some industries set very strict ones. We supply applications where the recycled fibre meets them, starting with wind energy."

contact:
  title: "Let's talk"
  body: "Whether you have composite waste, need recycled carbon fibre or want to support our work, we would like to hear from you."

