problem:
  title: "La fibre de carbone mérite mieux que la décharge"
  body: "Les composites à fibre de carbone rendent avions, véhicules, éoliennes et équipements sportifs plus légers et plus résistants. Produire cette fibre demande beaucoup d'énergie, et pourtant les chutes de production et les pièces en fin de vie sont encore largement mises en décharge ou incinérées."
  callout: "Nous pensons que cette fibre doit être récupérée et réutilisée."

approach:
  title: "Nous dissolvons la résine, pas la fibre"
  intro: "Plutôt que de brûler la résine, la solvolyse la dissout grâce à un procédé chimique, ce qui permet de séparer les fibres de carbone pour les nettoyer et les réutiliser."
  steps:
    - title: "Collecter"
      body: "Des déchets composites de presque toutes les industries : chutes de production, rebuts de préimprégnés et pièces en fin de vie."
    - title: "Récupérer"
      body: "La solvolyse dissout la matrice de résine et libère les fibres de carbone."
    - title: "Réintroduire"
      body: "La fibre propre retourne en production."

partners:
  title: "Deux façons de travailler avec nous"
  intro: "Nous travaillons des deux côtés de la chaîne de valeur des composites."
  waste:
    title: "Vous avez des déchets composites ?"
    body: "Transformez un problème d'élimination en ressource. Notre procédé traite les chutes de composites à fibre de carbone de presque toutes les industries, notamment :"
    items:
      - "Chutes de production des fabricants de fibre de carbone et de préimprégnés"
      - "Semelles de longerons de pales d'éoliennes"
      - "Réservoirs sous pression et réservoirs d'hydrogène"
      - "Chutes de l'aéronautique, du sport automobile et des articles de sport"
    note: "Composites époxy et la plupart des autres composites thermodurcissables."
  fibre:
    title: "Vous cherchez de la fibre recyclée ?"
    body: "Chaque application a ses exigences. Nous fournissons là où la fibre recyclée y répond, à commencer par l'éolien. Elle convient pour :"
    items:
      - "Non-tissés et mats"
      - "Compounds thermoplastiques pour l'injection et l'impression 3D"
      - "Rubans et fils"
      - "Compounds de moulage (SMC et BMC)"
    note: "Pas encore pour les pièces structurelles aéronautiques."

contact:
  title: "Refermons la boucle de la fibre de carbone"
  body: "Que vous ayez des déchets composites, besoin de fibre de carbone recyclée ou envie de soutenir notre projet, nous serions ravis d'échanger avec vous."

