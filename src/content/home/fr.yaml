meta:
  title: "Itera Materials · Fibre de carbone recyclée"
  description: "Itera Materials transforme les chutes de composites à fibre de carbone en fibre réutilisable par solvolyse : un matériau de haute performance retourne en production au lieu de finir en décharge."
  ogDescription: "La fibre de carbone est trop précieuse pour être gaspillée. Fibre de carbone recyclée à partir de chutes composites, par solvolyse."

